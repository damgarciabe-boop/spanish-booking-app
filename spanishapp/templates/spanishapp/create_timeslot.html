{% extends "spanishapp/base.html" %}

{% block title %}Create Time Slot{% endblock %}

{% block content %}
<h2>Create Available Time Slot</h2>

<div class="confirm-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-group">
            <button type="submit">Save Time Slot</button>
            <a href="/teacher/dashboard/"><button type="button">Go back</button></a>
        </div>
    </form>
</div>

<script>
    const startInput = document.getElementById('id_start_date_time');
    const endInput = document.getElementById('id_end_date_time');

    startInput.addEventListener('change', function() {
        if (startInput.value) {
            const startDate = new Date(startInput.value);
            startDate.setHours(startDate.getHours() + 1);
            const year = startDate.getFullYear();
            const month = String(startDate.getMonth() + 1).padStart(2, '0');
            const day = String(startDate.getDate()).padStart(2, '0');
            const hours = String(startDate.getHours()).padStart(2, '0');
            const minutes = String(startDate.getMinutes()).padStart(2, '0');
            endInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }
    });
</script>

{% endblock %}
