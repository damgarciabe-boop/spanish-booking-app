{% extends "spanishapp/base.html" %}

{% block title %}Book a class{% endblock %}

{% block content %}
<h2>Book a class</h2>
<h3>Select a course</h3>

<div class="card-grid">
{% for course in courses %}
    <div class="course-card">
        <h4>{{ course.title }}</h4>
        <p>{{ course.description }}</p>
        <p class="min-level">Minimum level: {{ course.min_level }}</p>
        <a href="/booking/teachers/{{ course.id }}/"><button>Select</button></a>
    </div>
{% endfor %}
</div>

<div class="button-group">
    <a href="/student/dashboard/"><button>Go back</button></a>
</div>

{% endblock %}
