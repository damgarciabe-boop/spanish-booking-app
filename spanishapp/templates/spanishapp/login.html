{% extends "spanishapp/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>

<div class="confirm-card">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Username</label>
            <input type="text" name="username" value="{{request.POST.username}}">
        </p>
        <p>
            <label>Password</label>
            <div>
                <input type="password" id="password" name="password">
                <button type="button" onclick="
                    var i = document.getElementById('password');
                    i.type = i.type === 'password' ? 'text' : 'password';
                    this.textContent = i.type === 'password' ? 'Show' : 'Hide';
                ">Show</button>
            </div>
        </p>
        <a href="{% url 'password_reset' %}">Forgot my password</a>
        <button type="submit">Login</button>
    </form>

    <p style="margin-top: 16px;">Don't have an account? <a href="{% url 'register_student' %}">Register here</a></p>
</div>

{% endblock %}
