{% extends "spanishapp/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>

<div class="confirm-card">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Username</label>
            <input type="text" name="username" value="{{ request.POST.username }}">
        </p>
        <p>
            <label>Password</label>
            <div style="position:relative;">
                <input type="password" id="password" name="password" style="padding-right: 40px; width:100%;">
                <span onclick="
                    var i = document.getElementById('password');
                    i.type = i.type === 'password' ? 'text' : 'password';
                    this.textContent = i.type === 'password' ? '👁' : '👁';
                " style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1rem; color:#888;">👁</span>
            </div>
        </p>
        <div class="button-group" style="margin-top:16px;">
            <button type="submit">Login</button>
        </div>
        <p style="margin-top:12px; font-size:0.85rem;">
            <a href="{% url 'password_reset' %}">Forgot my password?</a>
        </p>
    </form>

    <p style="margin-top: 16px;">Don't have an account? <a href="{% url 'register_student' %}">Register here</a></p>
</div>

{% endblock %}
