{% extends "spanishapp/base.html" %}

{% block title %}Student Dashboard{% endblock %}

{% block content %}
<h2>Welcome, {{ request.user.first_name }}!</h2>
<p class="course-selected">This is your student dashboard.</p>

<div class="dashboard-actions">
    <a href="/booking/" class="action-card">
        <h4>Book a class</h4>
        <p>Browse available courses and teachers</p>
    </a>
    <a href="/my_bookings/" class="action-card">
        <h4>My bookings</h4>
        <p>View and manage your reservations</p>
    </a>
</div>

{% endblock %}
